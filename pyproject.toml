[project]
name = "ai-compass"
version = "0.1.0"
description = "Enterprise AI policy RAG, governed review and evidence workspace"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.162,<1", "uvicorn>=0.54,<1",
  "streamlit>=1.67,<2", "langchain>=1.4,<2", "langchain-openai>=1.7,<2",
  "langchain-text-splitters>=1.1,<2", "langgraph>=1.2,<2", "langsmith>=0.14,<1",
  "qdrant-client>=1.20,<2", "sqlalchemy>=2.1,<3", "psycopg[binary]>=3.3,<4",
  "socksio>=1,<2", "rank-bm25==0.2.2", "pydantic>=2.14,<3", "python-dotenv>=1,<2"
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
